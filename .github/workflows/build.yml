name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, platform-independent logic tests (Xtream parsing, country inference,
  # curation). Runs on Linux because fluxxx-core has no Tauri/OS dependencies.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core crate
        run: cargo test -p fluxxx-core --locked

  # Compile the actual Windows .exe + installer and publish them as artifacts.
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: write # needed for release upload on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (exe + NSIS installer)
        run: npm run tauri build

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          Copy-Item target/release/fluxxx.exe dist-portable/
          Compress-Archive -Path dist-portable/* -DestinationPath fluxxx-portable-windows-x64.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxxx-portable-windows-x64
          path: fluxxx-portable-windows-x64.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxxx-installer-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fluxxx-portable-windows-x64.zip
            target/release/bundle/nsis/*-setup.exe
