[package]
name = "fluxxx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-independent core logic for fluxxx: Xtream Codes client models, EPG parsing, and channel curation."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
# native-tls → SChannel on Windows (no NASM/aws-lc-rs build tooling needed).
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"], optional = true }

[features]
default = []
# Enables the real reqwest-backed Fetcher; the app crate turns this on. Left off
# for pure-logic tests so they stay fast and network-free.
net = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
